<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#005BB4;--blue2:#0C91CA;--text:#0B1822;--muted:#4a6070;--bg:#f4f8fb;--white:#fff}
body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--white);border-bottom:3px solid var(--blue2);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,91,180,.07)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;display:block}
.logo{font-family:'Days One',sans-serif;font-size:22px;background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.badge{font-size:12px;background:rgba(12,145,202,.09);border:1.5px solid var(--blue2);color:var(--blue2);border-radius:20px;padding:4px 12px;font-family:'Days One',sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
.drop-zone{width:100%;max-width:560px;background:var(--white);border:2.5px dashed rgba(12,145,202,.4);border-radius:20px;padding:56px 40px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.drop-zone:hover,.drop-zone.over{border-color:var(--blue2);background:rgba(12,145,202,.04);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,91,180,.10)}
.drop-icon{font-size:56px;margin-bottom:16px;display:block}
.drop-zone h2{font-family:'Days One',sans-serif;font-size:22px;background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.drop-zone p{color:var(--muted);font-size:15px;line-height:1.6}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.btn-pick{display:inline-block;margin-top:20px;padding:10px 28px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-radius:30px;font-family:'Days One',sans-serif;font-size:14px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,91,180,.25);transition:all .2s;position:relative;z-index:2}
.btn-pick:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,91,180,.35)}
#status{max-width:560px;width:100%;margin-top:28px;display:none}
.progress-bar{height:6px;background:rgba(12,145,202,.15);border-radius:6px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:6px;width:0%;transition:width .4s ease}
.status-text{font-size:14px;color:var(--muted);text-align:center}
#result{max-width:560px;width:100%;margin-top:20px;display:none;background:var(--white);border-radius:16px;padding:28px 32px;box-shadow:0 4px 24px rgba(0,91,180,.08);border:1px solid rgba(12,145,202,.12)}
#result h3{font-family:'Days One',sans-serif;font-size:18px;color:var(--blue);margin-bottom:16px}
.result-meta{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.9}
.result-meta span{color:var(--blue2);font-weight:500}
.btn-download{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border:none;border-radius:12px;font-family:'Days One',sans-serif;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,91,180,.25);transition:all .2s;margin-bottom:10px;display:block}
.btn-download:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,91,180,.35)}
.btn-reset{width:100%;padding:10px;background:none;border:1.5px solid rgba(12,145,202,.3);border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;transition:all .2s}
.btn-reset:hover{border-color:var(--blue2);color:var(--blue2)}
.lightbox{display:none;position:fixed;inset:0;background:rgba(5,20,40,.88);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px);cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);object-fit:contain;cursor:default}
.lb-close{position:fixed;top:18px;right:24px;color:white;font-size:36px;cursor:pointer;line-height:1;opacity:.85}
.lb-close:hover{opacity:1}
.mode-toggle{display:flex;gap:8px;margin-bottom:10px}
.mode-btn{flex:1;padding:9px 0;border-radius:10px;border:1.5px solid rgba(12,145,202,.3);background:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:'Roboto',sans-serif;transition:all .2s}
.mode-btn.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-color:transparent;font-weight:500}
.mode-btn:hover:not(.active){border-color:var(--blue2);color:var(--blue2)}
.mode-hint{font-size:13px;color:var(--muted);margin-bottom:14px;text-align:center}
.typo-toggle{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.typo-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue2);cursor:pointer;flex-shrink:0}
.opt-row{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin-top:10px;font-size:13px;color:var(--muted)}
.opt-row select{flex:1;padding:7px 10px;border-radius:9px;border:1.5px solid rgba(12,145,202,.3);background:var(--white);color:var(--text);font-family:'Roboto',sans-serif;font-size:13px;cursor:pointer}
.opt-row select:focus,.opt-row input:focus{outline:none;border-color:var(--blue2)}

<main>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".docx">
    <span class="drop-icon">📄</span>
    <h2>Перетащи DOCX сюда</h2>
    <p>или нажми кнопку и выбери файл<br>Файлы никуда не уходят — всё в браузере</p>
    <button class="btn-pick" onclick="document.getElementById('fileInput').click();event.stopPropagation()">Выбрать файл</button>
  </div>
  <label class="typo-toggle" id="typoToggle">
    <input type="checkbox" id="typoCheckbox" checked>
    Применять русскую типографику (тире, кавычки-ёлочки, неразрывные пробелы — как в Tireo)
  </label>
  <div class="opt-row">
    <span>Курс:</span>
    <input type="text" id="courseInput" placeholder="Клик за кликом осваиваем интернет и ПК">
  </div>
  <div class="opt-row">
    <span>Скриншоты:</span>
    <select id="shrinkSelect">
      <option value="1920" selected>до 1920 px — качество как в оригинале</option>
      <option value="1600">до 1600 px — если файл не проходит в плагин</option>
      <option value="1280">до 1280 px — по ширине слайда, крайний случай</option>
      <option value="0">не трогать совсем</option>
    </select>
  </div>
  <div id="status">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="status-text" id="statusText">Читаю файл...</p>
  </div>
  <div id="result">
    <h3>✅ Готово!</h3>
    <div class="result-meta" id="resultMeta"></div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeBrowser" onclick="setMode('browser')">🌐 Браузер</button>
      <button class="mode-btn" id="modeFigma" onclick="setMode('figma')">🎨 Figma</button>
    </div>
    <p class="mode-hint" id="modeHint">Полная лекция со скроллом и лайтбоксом</p>
    <div id="dlBox"></div>
    <button class="btn-reset" onclick="resetUI()">← Конвертировать ещё один</button>
  </div>
</main>
<footer>© SmartComp Converter — работает полностью в браузере</footer>
<div class="lightbox" id="lightbox" onclick="closeLB(event)">
  <span class="lb-close" onclick="closeLB()">&#x2715;</span>
  <img id="lbImg" src="" alt="" onclick="event.stopPropagation()">
</div>
<script>
// ── Drag & Drop ──
const zone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let _browserHtml = '';
let _figmaParts = [];
let _fileName = '';
let _currentMode = 'browser';
zone.addEventListener('dragover', e=>{e.preventDefault();zone.classList.add('over')});
zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
zone.addEventListener('drop', e=>{
  e.preventDefault();zone.classList.remove('over');
  const f=e.dataTransfer.files[0];
  if(f&&f.name.endsWith('.docx')) processFile(f);
  else alert('Нужен файл .docx');
});
fileInput.addEventListener('change', e=>{if(e.target.files[0]) processFile(e.target.files[0])});

// Название курса и номер лекции живут между запусками: курс на серию
// лекций один и тот же, вбивать его каждый раз незачем
const COURSE_KEY = 'smartcomp-course';
try{
  const c = localStorage.getItem(COURSE_KEY);
  if(c) document.getElementById('courseInput').value = c;
}catch(e){ /* приватный режим — просто не запоминаем */ }

function rememberMeta(){
  try{
    localStorage.setItem(COURSE_KEY, document.getElementById('courseInput').value);
  }catch(e){}
}

// Номер лекции берём из имени файла: «Лекция 2. Оформление ПК.docx» → 2.
// Если слова «лекция» нет — просто первое число в имени.
let _lecNum = '';
function lectureNumberFrom(fileName){
  const name = fileName.replace(/\.docx$/i, '');
  const m = name.match(/лекци[яю]\s*[№#]?\s*(\d{1,3})/i) || name.match(/(\d{1,3})/);
  return m ? m[1] : '';
}

function setMode(mode){
  _currentMode = mode;
  document.getElementById('modeBrowser').classList.toggle('active', mode==='browser');
  document.getElementById('modeFigma').classList.toggle('active', mode==='figma');
  document.getElementById('modeHint').textContent = mode==='browser'
    ? 'Полная лекция со скроллом и лайтбоксом'
    : 'Слайды 1280×720 по правилам вёрстки SmartComp — для импорта в Figma';
  renderDownloads();
}

function setProgress(pct,text){
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('statusText').textContent=text;
}
function resetUI(){
  document.getElementById('dropZone').style.display='block';
  document.getElementById('status').style.display='none';
  document.getElementById('result').style.display='none';
  fileInput.value='';
}
function closeLB(e){
  if(!e||e.target===document.getElementById('lightbox')||e.target===document.querySelector('.lb-close')){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow='';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB()});

// ── Tireo: русская типографика (портировано из Tireo-Win.ahk) ──
// Правила берутся из настольного Tireo: неразрывные пробелы, тире,
// кавычки-ёлочки, разряды чисел, сокращения, инициалы.
const NBSP = ' ';
const LETTERS = 'A-Za-zА-Яа-яЁё';

const RU_AFTER = ["в","к","с","у","о","и","а","я","на","по","за","из","от","до","об","во","ко","со","не","ни","но","да","то","ты","мы","вы","он","их","её","им","для","под","над","при","без","про","или","либо","ибо","что","чем","как","так","она","оно","они","его","нас","вам","нам","том","тот","это","эта","эти","все","всё","тех","мой","моя","мои","наш","ваш","уже","ещё","вот","вон"];
const RU_BEFORE = ["бы","ли","же"];
const EN_AFTER = ["of","in","to","on","at","by","up","if","or","so","as","for","off","out","via","per","and","but","nor","yet","from","into","onto","upon","with","over","down","near","past","than","that","when","then","once","till","lest","whom"];
const ABBREV = ["г.","гг.","в.","вв.","см.","ср.","напр.","т.е.","т.д.","т.п.","т.к.","руб.","коп.","кв.","куб.","г-н","г-жа","д-р","проф."];

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// Регулярки компилируем один раз при загрузке — быстрее на больших лекциях
const RU_AFTER_RE   = RU_AFTER.map(w=>new RegExp(`(?<![${LETTERS}])(${w}) `,'gi'));
const RU_BEFORE_RE  = RU_BEFORE.map(w=>new RegExp(` (${w})(?![${LETTERS}])`,'gi'));
const EN_AFTER_RE   = EN_AFTER.map(w=>new RegExp(`(?<![${LETTERS}])(${w}) `,'gi'));
const ABBREV_RE     = ABBREV.map(a=>new RegExp(`(?<![${LETTERS}])(${escapeRe(a)}) `,'gi'));

function fixWhitespace(text){
  // Только схлопываем повторные пробелы — обрезку по краям строк не делаем,
  // т.к. функция вызывается на кусочках текста между HTML-тегами и можно
  // случайно съесть пробел-разделитель между словами.
  return text.replace(/ {2,}/g,' ');
}

function fixQuotes(text){
  text = text.replace(/"\s*([^"\r\n]+?)\s*"/g,'«$1»');
  text = text.replace(/“\s*([^“”\r\n]+?)\s*”/g,'«$1»');
  text = text.replace(/„\s*([^„“\r\n]+?)\s*“/g,'«$1»');
  text = text.replace(/'\s*([^'\r\n]+?)\s*'/g,'‘$1’');
  text = text.replace(new RegExp(`(?<=[${LETTERS}])'(?=[${LETTERS}])`,'g'),'’');
  text = text.replace(/«{2,}/g,'«');
  text = text.replace(/»{2,}/g,'»');
  return text;
}

function fixDashes(text){
  text = text.replace(/-{2,3}/g,'—');
  text = text.replace(/(?<=\S)\s-\s(?=\S)/g, NBSP+'— ');
  text = text.replace(/(?<!\d)(\d+)-(\d+)(?!\d)/g,'$1–$2');
  text = text.replace(/(\d+-(?:й|го|ой|ая|ое|ые|ым|ом|его|му|м))\s/g,'$1'+NBSP);
  return text;
}

function groupThousands(numStr){
  let result='', count=0;
  for(let i=numStr.length-1;i>=0;i--){
    result = numStr[i]+result;
    count++;
    if(count===3 && i>0){ result = NBSP+result; count=0; }
  }
  return result;
}

function fixNumbers(text){
  text = text.replace(/\(c\)/gi,'©').replace(/\(r\)/gi,'®').replace(/\(tm\)/gi,'™');
  text = text.split('1/2').join('½').split('1/4').join('¼').split('3/4').join('¾');
  text = text.replace(/\bUSD\b/gi,'$').replace(/\bEUR\b/gi,'€').replace(/\bGBP\b/gi,'£').replace(/\bJPY\b/gi,'¥');
  text = text.replace(/([\$€£¥₽])\s+(?=\d)/g,'$1');
  text = text.replace(/\d{5,}/g, m=>groupThousands(m));
  text = text.replace(/(\d)\s?%/g,'$1'+NBSP+'%');
  return text;
}

function fixAbbreviations(text){
  for(const re of ABBREV_RE) text = text.replace(re,'$1'+NBSP);
  return text;
}
function fixNbspRu(text){
  for(const re of RU_AFTER_RE) text = text.replace(re,'$1'+NBSP);
  for(const re of RU_BEFORE_RE) text = text.replace(re, NBSP+'$1');
  return text;
}
function fixNbspEn(text){
  for(const re of EN_AFTER_RE) text = text.replace(re,'$1'+NBSP);
  return text;
}
function fixNames(text){
  text = text.replace(new RegExp(`(?<![${LETTERS}])([A-ZА-ЯЁ]\\.)\\s(?=[A-ZА-ЯЁ]\\.)`,'g'),'$1'+NBSP);
  text = text.replace(/([A-ZА-ЯЁ]\.)\s(?=[A-ZА-ЯЁёа-я][a-zа-яё]+)/g,'$1'+NBSP);
  return text;
}

function applyTypography(text){
  text = fixWhitespace(text);
  text = fixQuotes(text);
  text = fixNumbers(text);
  text = fixDashes(text);
  text = fixAbbreviations(text);
  text = fixNbspRu(text);
  text = fixNbspEn(text);
  text = fixNames(text);
  return text;
}

// Применяем типографику только к тексту между тегами — сами теги и
// data:URI картинок внутри них не трогаем (иначе побьём base64/атрибуты)
function applyTypographyHtml(html){
  return html.split(/(<[^>]+>)/g).map(part=>
    part.startsWith('<') ? part : applyTypography(part)
  ).join('');
}

// ── Уменьшение скриншотов ────────────────────────────────────────────
// Зачем: в HTML скриншоты лежат как base64, и лекция на 85 картинок
// в оригинале весит под шестьдесят мегабайт. Плагин Figma передаёт
// данные одним сообщением, и такой файл отвечает «payload too large
// to transfer».
//
// Делаем только одно — уменьшаем слишком большие картинки. Палитру
// не режем: на широких раскладках (скриншот 18:9 во всю ширину слайда)
// потеря цвета сразу заметна, а экономия того не стоит.
//
// 1920 px выбраны не случайно: скриншоты приходят 1919 px, то есть
// на этой ступени они вообще не пересчитываются и остаются исходными.
// Уменьшаются только вертикальные снимки телефона (925×2048) — они
// в макете стоят высотой 622 px, запас всё равно тройной.

// Размеры каждой картинки: по ним слайд понимает, экран это компьютера
// (шире, чем выше) или снимок телефона. Ключ — тот самый data URI,
// который потом попадёт в разметку.
const IMG_SIZES = new Map();

function measureDataUri(dataUri){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload  = ()=>{ IMG_SIZES.set(dataUri, {w:img.naturalWidth, h:img.naturalHeight}); resolve(); };
    img.onerror = ()=>resolve();
    img.src = dataUri;
  });
}

function shrinkDataUri(dataUri, maxSide){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        // Вписываем в квадрат maxSide×maxSide. Ограничивать одну ширину
        // мало: вертикальные скриншоты телефона приходят узкими, но
        // длинными и под ограничение по ширине не попадают вовсе.
        const scale = Math.min(1, maxSide / img.width, maxSide / img.height);
        if(scale === 1){ resolve(dataUri); return; }   // уменьшать нечего

        const w = Math.max(1, Math.round(img.width  * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const out = c.toDataURL('image/png');
        // Подстраховка: если вдруг стало тяжелее — отдаём оригинал
        resolve(out.length < dataUri.length ? out : dataUri);
      }catch(err){
        console.warn('Уменьшить не удалось, беру оригинал:', err);
        resolve(dataUri);
      }
    };
    img.onerror = ()=>resolve(dataUri);   // битая картинка — пропускаем как есть
    img.src = dataUri;
  });
}

// ── Main ──
async function processFile(file){
  document.getElementById('dropZone').style.display='none';
  document.getElementById('status').style.display='block';
  document.getElementById('result').style.display='none';
  setProgress(10,'Читаю DOCX...');

  const arrayBuffer = await file.arrayBuffer();
  const imageMap = {};
  let imgCounter = 0;

  setProgress(30,'Извлекаю скриншоты...');

  rememberMeta();
  _lecNum = lectureNumberFrom(file.name);

  const shrinkTo = parseInt(document.getElementById('shrinkSelect').value, 10) || 0;
  let bytesBefore = 0, bytesAfter = 0;

  const result = await mammoth.convertToHtml({arrayBuffer},{
    convertImage: mammoth.images.imgElement(async (image)=>{
      imgCounter++;
      const idx = imgCounter;
      const data = await image.read('base64');
      const ct = image.contentType||'image/png';
      const ext = ct.includes('jpeg')?'jpg':ct.split('/')[1]||'png';
      imageMap[idx]={data,ext,ct};

      let uri = `data:${ct};base64,${data}`;
      bytesBefore += uri.length;

      if(shrinkTo){
        // Прогресс 30..80 %: общее число картинок заранее неизвестно,
        // поэтому шкалу подтягиваем асимптотически — она не дёргается
        // назад и не упирается в 80 раньше времени.
        setProgress(30 + Math.round(50 * (1 - 1/(1 + imgCounter/25))),
                    `Обрабатываю скриншот ${imgCounter}...`);
        uri = await shrinkDataUri(uri, shrinkTo);
      }
      bytesAfter += uri.length;

      await measureDataUri(uri);
      return {src: uri};
    })
  });

  setProgress(85,'Применяю типографику...');

  const typoOn = document.getElementById('typoCheckbox').checked;
  const converted = typoOn ? applyTypographyHtml(result.value) : result.value;

  const title = extractTitle(converted)||file.name.replace(/\.docx$/i,'');
  _browserHtml = buildHtml(title, converted);
  _figmaParts  = buildFigmaHtml(title, converted);
  _fileName    = file.name;

  setProgress(100,'Готово!');

  const mb = b => (b/1024/1024).toFixed(1);
  const browserMb = mb(new Blob([_browserHtml],{type:'text/html'}).size);
  const figmaTotal = _figmaParts.reduce((a,p)=>a + p.bytes, 0);
  const heaviest   = Math.max(..._figmaParts.map(p=>p.bytes));
  const figmaOk    = heaviest <= FIGMA_LIMIT;

  let shrinkLine = '';
  if(shrinkTo && bytesBefore){
    const saved = Math.round(100 * (1 - bytesAfter/bytesBefore));
    shrinkLine = `🗜️ Скриншоты: <span>до ${shrinkTo} px, минус ${saved}%</span><br>`;
  }else{
    shrinkLine = `🗜️ Скриншоты: <span>без сжатия</span><br>`;
  }

  document.getElementById('result').style.display='block';
  document.getElementById('status').style.display='none';
  document.getElementById('resultMeta').innerHTML=
    `📄 Файл: <span>${file.name}</span><br>`+
    `🖼️ Скриншотов: <span>${imgCounter}</span><br>`+
    shrinkLine+
    `🌐 Браузерный HTML: <span>${browserMb} МБ</span><br>`+
    `🎨 Figma HTML: <span class="${figmaOk?'size-ok':'size-warn'}">${mb(figmaTotal)} МБ</span>`+
    (_figmaParts.length > 1
       ? ` — не влезает в плагин целиком, разбил на ${_figmaParts.length} файла`
       : (figmaOk ? ' — пройдёт в плагин' : ' — плагин может отказать'))+
    (typoOn?`<br>✒️ Типографика: <span>применена</span>`:'');

  renderDownloads();
}

// Кнопки скачивания. Если Figma-файл пришлось разбить, на каждую часть
// своя кнопка: видно диапазон слайдов и вес.
function renderDownloads(){
  const box = document.getElementById('dlBox');
  if(!box) return;
  box.innerHTML = '';

  const mb   = b => (b/1024/1024).toFixed(1);
  const name = _fileName.replace(/\.docx$/i,'').replace(/[^\wА-Яа-яёЁ]/g,'-').slice(0,40);

  const save = (html, suffix)=>{
    const blob = new Blob([html],{type:'text/html;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + suffix + '.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  };

  const button = (label, html, suffix)=>{
    const b = document.createElement('button');
    b.className = 'btn-download';
    b.textContent = label;
    b.onclick = ()=>save(html, suffix);
    box.appendChild(b);
  };

  if(_currentMode === 'browser'){
    button('⬇️ Скачать HTML', _browserHtml, '');
    return;
  }
  if(_figmaParts.length === 1){
    button('⬇️ Скачать HTML', _figmaParts[0].html, '-figma');
    return;
  }
  _figmaParts.forEach((part, i)=>{
    button(`⬇️ Часть ${i+1} — слайды ${part.from}–${part.to}, ${mb(part.bytes)} МБ`,
           part.html, `-figma-часть-${i+1}`);
  });
}

// ── Helpers ──
function extractTitle(html){
  const m=html.match(/<h[12][^>]*>(.*?)<\/h[12]>/i);
  return m?m[1].replace(/<[^>]+>/g,''):'';
}
function extractSubtitle(html){
  const all=[...html.matchAll(/<p>(.*?)<\/p>/g)];
  for(const m of all){
    const t=m[1].replace(/<[^>]+>/g,'').trim();
    if(t.length>40&&t.length<250) return t;
  }
  return '';
}

function buildHtml(title, raw){
  let h = raw;

  // Wrap <img> (data URI) in screenshot-wrap div
  h=h.replace(/(<img src="data:[^"]+)"([^>]*)\/?>/g,
    (_, src, rest)=>`</p><div class="screenshot-wrap"><img ${src}" ${rest} loading="lazy"></div><p>`);

  // Clean empty tags
  h=h.replace(/<p>\s*<\/p>/g,'');
  h=h.replace(/<p>(<div)/g,'$1');
  h=h.replace(/(<\/div>)<\/p>/g,'$1');

  // Headings
  h=h.replace(/<h1>/g,'<h1 class="title">');
  h=h.replace(/<h2>/g,'<h2 class="section-title">');
  h=h.replace(/<h3>/g,'<h3 class="sub-title">');
  h=h.replace(/<h4>/g,'<h4 class="sub-sub-title">');

  // Lists
  h=h.replace(/<ul>/g,'<ul class="sc-list">');
  h=h.replace(/<ol>/g,'<ol class="sc-list sc-ol">');

  // Bold-only short para → sub-heading or step
  h=h.replace(/<p><strong>([^<]{1,60})<\/strong><\/p>/g,(_,t)=>
    (t.endsWith('.')||t.endsWith(','))
      ?`<div class="step-block"><p>${t}</p></div>`
      :`<h3 class="sub-title">${t}</h3>`
  );

  // Intro label (ends with :)
  h=h.replace(/<p>([^<]{10,120}:)\s*<\/p>/g,'<p class="intro-label">$1</p>');

  const subtitle=extractSubtitle(raw);

  return `<!DOCTYPE html>

// ── Figma-mode builder — слайды 1280×720 по «Правилам вёрстки SmartComp» ──
// Контент из DOCX разбивается на слайды: шапка 40px, панель Glow справа,
// скриншоты слева. Раскладка выбирается автоматически по числу скриншотов.

const FG = {
  SLIDE_W: 1280, SLIDE_H: 720,
  HEAD_H: 40, BODY_H: 680,
  GLOW_WIDE: 585, GLOW_NARROW: 310,
  MAX_CONTENT_H: 440,   // сколько контента влезает в панель Glow
  MAX_IMGS: 2           // максимум скриншотов на слайде
};

// Подложка под фоновую иллюстрацию. Кладётся первым элементом каждого
// слайда, включая титул и содержание. Имя слоя после импорта разные
// плагины берут из разных мест, поэтому проставляем сразу все ходовые
// атрибуты — какой-нибудь да подхватится.
const BG_IMG = '<div class="bg-img" id="BG IMG" data-name="BG IMG" '+
               'data-layer-name="BG IMG" data-figma-name="BG IMG" '+
               'aria-label="BG IMG" title="BG IMG"></div>';

function fgEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 1. Разбираем HTML от mammoth в плоский список блоков
function figmaTokenize(raw){
  const doc = new DOMParser().parseFromString('<div id="scroot">'+raw+'</div>','text/html');
  const out = [];
  (function walk(parent){
    for(const el of parent.children){
      const tag = el.tagName.toLowerCase();
      if(/^h[1-6]$/.test(tag)){
        const t = el.textContent.trim();
        if(t) out.push({type:'h', level:+tag[1], text:t});
      } else if(tag==='ul' || tag==='ol'){
        const items = [...el.children]
          .filter(li=>li.tagName.toLowerCase()==='li')
          .map(li=>li.innerHTML.trim()).filter(Boolean);
        if(items.length) out.push({type:'list', ordered:tag==='ol', items});
      } else if(tag==='img'){
        out.push({type:'img', src:el.getAttribute('src')});
      } else if(tag==='p'){
        // картинки вытаскиваем отдельно — они уходят в левую колонку слайда
        [...el.querySelectorAll('img')].forEach(im=>out.push({type:'img', src:im.getAttribute('src')}));
        const clone = el.cloneNode(true);
        [...clone.querySelectorAll('img')].forEach(im=>im.remove());
        const txt = clone.textContent.trim();
        if(txt) out.push({type:'p', html:clone.innerHTML.trim(), text:txt});
      } else if(tag==='table'){
        out.push({type:'p', html:el.outerHTML, text:el.textContent.trim()});
      } else {
        walk(el);
      }
    }
  })(doc.getElementById('scroot'));
  return out;
}

// 2. Прикидываем высоту блока, чтобы понять, влезет ли он в панель Glow
function figmaCost(b){
  if(b.type==='h')    return b.level<=2 ? 42 : 34;
  if(b.type==='p')    return 12 + Math.max(1, Math.ceil(b.text.length/56)) * 27;
  if(b.type==='list') return b.items.reduce((s,i)=>{
    const len = i.replace(/<[^>]+>/g,'').length;
    return s + 41 + Math.floor(len/56) * 24;
  },0);
  return 0;
}

// Голый текст блока — нужен, чтобы искать ключевые слова вроде «пример»
function blockText(b){
  if(b.type === 'p')    return b.text || '';
  if(b.type === 'list') return b.items.map(i=>i.replace(/<[^>]+>/g,'')).join(' ');
  return '';
}
const EXAMPLE_RE = /пример/i;   // «пример», «примеры», «примером» — подпись «Пример N» на скриншот

// 3. Пары «текст + картинки»
//    В исходном DOCX текст всегда стоит ПЕРЕД картинкой и относится
//    именно к ней. Поэтому режем поток не по переполнению панели,
//    а по этой связке: копим текст, потом забираем все идущие следом
//    картинки. Как только после картинок снова пошёл текст — пара
//    закрыта, начинается следующая.
function figmaPairs(blocks){
  const pairs = [];
  let heading = '';
  let cur = {heading:'', blocks:[], imgs:[], newSection:false};
  let curCost = 0;

  const flush = ()=>{
    if(cur.blocks.length || cur.imgs.length) pairs.push(cur);
    cur = {heading, blocks:[], imgs:[], newSection:false};
    curCost = 0;
  };

  for(const b of blocks){
    if(b.type === 'h'){
      if(b.level === 1) continue;          // h1 — название лекции, оно на титуле
      flush();
      heading = b.text;
      cur.heading = heading;
      cur.newSection = true;               // с заголовка всегда начинаем новый слайд
      continue;
    }
    if(b.type === 'img'){ cur.imgs.push(b.src); continue; }

    // Текст после картинок — значит предыдущая связка закончилась
    if(cur.imgs.length) flush();

    // Текста одной темы набралось больше, чем влезает на панель —
    // не ждём картинку или следующий заголовок, режем здесь.
    // Так длинная тема без подзаголовков растягивается на 2+ слайда
    // вместо того, чтобы вся копиться в одну связку.
    const cost = figmaCost(b);
    if(cur.blocks.length && curCost + cost > FG.MAX_CONTENT_H) flush();

    cur.blocks.push(b);
    curCost += cost;
  }
  flush();
  return pairs;
}

// Какого рода картинки в паре. Скриншот с компьютера шире, чем выше;
// снимок телефона наоборот. Размеры берём из замеров, сделанных при
// обработке файла.
function pairKind(pair){
  if(!pair.imgs.length) return 'text';
  const sizes = pair.imgs.map(src=>IMG_SIZES.get(src)).filter(Boolean);
  if(!sizes.length) return 'desktop';                 // не измерили — считаем экраном ПК
  return sizes.every(s=>s.w >= s.h) ? 'desktop' : 'phone';
}

// 4. Пары раскладываем по слайдам
function figmaGroup(blocks){
  const pairs = figmaPairs(blocks);
  const slides = [];

  const MAX_PHONE = 4;   // телефонов в ряд
  const MAX_TEXT_H = 440;
  const MAX_GLASS_H = 300;   // стеклянная плашка поверх скриншота уже текстовой панели — тексту там теснее

  let i = 0;
  while(i < pairs.length){
    const pair = pairs[i];
    const kind = pairKind(pair);

    if(kind === 'desktop'){
      // Плашка на скриншоте уже прошла общий лимит в figmaPairs, но он
      // рассчитан на широкую текстовую панель. Для узкой стеклянной
      // плашки лимит ниже — если всё ещё не влезает, отрезаем текст,
      // который стоит дальше от картинки, отдельным текстовым слайдом
      // перед ней. К картинке остаётся то, что было ближе всего к ней.
      let glassBlocks = pair.blocks;
      const glassCost = glassBlocks.reduce((a,b)=>a + figmaCost(b), 0);
      if(glassCost > MAX_GLASS_H){
        let cost = 0, cut = glassBlocks.length;
        for(let j = glassBlocks.length - 1; j >= 0; j--){
          const c = figmaCost(glassBlocks[j]);
          if(cost + c > MAX_GLASS_H && cost > 0) break;
          cost += c;
          cut = j;
        }
        const overflow = glassBlocks.slice(0, cut);
        glassBlocks = glassBlocks.slice(cut);
        if(overflow.length){
          slides.push({layout:'text', heading: pair.heading, blocks: overflow});
        }
      }

      // Исключение: «Примеры кнопок…», «Пример работы…» и т.п. перед
      // рядом однотипных скриншотов — каждый пример на свой слайд с
      // подписью «Пример N», а не все скопом на одну плашку.
      const introText = glassBlocks.map(blockText).join(' ');
      if(EXAMPLE_RE.test(introText) && pair.imgs.length >= 2){
        pair.imgs.forEach((src, idx)=>{
          slides.push({
            layout:'desktop',
            heading: pair.heading,
            blocks: idx === 0 ? glassBlocks : [],   // вступление — только на первом примере
            imgs: [src],
            exampleLabel: `Пример ${idx + 1}`
          });
        });
        i++;
        continue;
      }

      // Картинки без текста между ними — это один и тот же кусок текста
      // на все сразу (дублировать подпись не нужно). Кладём все скриншоты
      // связки на один слайд; сколько их и как расставить — потом руками
      // в Figma.
      slides.push({
        layout:'desktop',
        heading: pair.heading,
        blocks: glassBlocks,
        imgs: pair.imgs
      });
      i++;
      continue;
    }

    if(kind === 'phone'){
      // Соседние пары с телефонами собираем в один слайд колонками,
      // пока их суммарно не больше четырёх и раздел не сменился
      const cols = [];
      let total = 0;
      while(i < pairs.length){
        const nx = pairs[i];
        if(pairKind(nx) !== 'phone') break;
        if(cols.length && nx.newSection) break;
        if(total + nx.imgs.length > MAX_PHONE) break;
        cols.push(nx); total += nx.imgs.length;
        i++;
      }
      slides.push({layout:'phone', heading: cols[0].heading, cols});
      continue;
    }

    // Текст без картинок. Соседние текстовые куски одного раздела
    // сливаем, пока панель не переполнится
    const textPair = {layout:'text', heading: pair.heading, blocks: [...pair.blocks], imgs: []};
    let h = pair.heading ? 42 : 0;
    for(const b of pair.blocks) h += figmaCost(b);
    i++;
    while(i < pairs.length){
      const nx = pairs[i];
      if(pairKind(nx) !== 'text' || nx.newSection) break;
      const add = nx.blocks.reduce((a,b)=>a + figmaCost(b), 0);
      if(h + add > MAX_TEXT_H) break;
      textPair.blocks.push(...nx.blocks); h += add;
      i++;
    }
    slides.push(textPair);
  }

  return slides;
}

// 5. Рендер текстовых блоков
function figmaRenderBlocks(blocks){
  return blocks.map(b=>{
    if(b.type === 'p')    return `<p class="sc-p">${b.html}</p>`;
    if(b.type === 'list') return `<ul class="sc-items">`+b.items.map(i=>`<li>${i}</li>`).join('')+`</ul>`;
    return '';
  }).join('');
}

// 6. Один слайд
function figmaSlide(slide, num, sectionFallback){
  const section = fgEsc(slide.heading || sectionFallback);
  const head = `<div class="sl-head">`+
    `<span class="hd-l"><span class="hd-num">${num}</span><i>|</i>${section}</span>`+
    `<span class="hd-r">SmartComp <span class="hd-tel">*3196</span></span></div>`;
  const copy = `<div class="sl-copy">Инструкция является интеллектуальной собственностью компании SmartComp и защищена авторским правом. Копирование или распространение материала третьим лицам карается законом Израиля.</div>`;
  const heading = slide.heading ? `<div class="sc-h">${fgEsc(slide.heading)}</div>` : '';

  // ── Скриншоты компьютера: экран во весь слайд, текст стеклянной
  //    плашкой поверх. Сторону чередуем, чтобы плашка не закрывала
  //    всё время одно и то же место интерфейса.
  if(slide.layout === 'desktop'){
    const shots = slide.imgs.map(src=>`<div class="desk-shot"><img src="${src}" alt=""></div>`).join('');
    const two   = slide.imgs.length > 1 ? ' desk-two' : '';
    const side  = num % 2 === 0 ? 'glass-left' : 'glass-right';
    // На слайде-примере название темы в плашке не повторяем — вместо
    // него «Пример N», тема и так видна в шапке слайда
    const glassHead = slide.exampleLabel ? `<div class="sc-h">${fgEsc(slide.exampleLabel)}</div>` : heading;
    const text  = glassHead + figmaRenderBlocks(slide.blocks);
    const glass = text ? `<div class="glass ${side}">${text}</div>` : '';
    return `<section class="slide slide-desk">${BG_IMG}${head}
  <div class="desk-media${two}">${shots}</div>
  ${glass}
  ${copy}</section>`;
  }

  // ── Телефоны: колонками, над каждой свой текст
  if(slide.layout === 'phone'){
    const cols = slide.cols.map(c=>{
      const txt = figmaRenderBlocks(c.blocks);
      const ims = c.imgs.map(src=>`<div class="ph-shot"><img src="${src}" alt=""></div>`).join('');
      return `<div class="ph-col">`+
             (txt ? `<div class="ph-txt">${txt}</div>` : '')+
             `<div class="ph-shots">${ims}</div></div>`;
    }).join('');
    return `<section class="slide slide-phone">${BG_IMG}${head}
  <div class="sl-body ph-cols">${cols}</div>
  ${copy}</section>`;
  }

  // ── Только текст. Длинный кусок — в две колонки, короткий — панелью
  //    по центру: колонки разорвали бы короткий абзац пополам.
  const content = heading + figmaRenderBlocks(slide.blocks);
  const long = slide.blocks.reduce((a,b)=>a + figmaCost(b), 0) > 300;
  if(long){
    return `<section class="slide slide-text">${BG_IMG}${head}
  <div class="sl-body"><div class="text-2col">${content}</div></div>
  ${copy}</section>`;
  }
  return `<section class="slide">${BG_IMG}${head}
  <div class="sl-body sl-solo"><div class="glow glow-wide">${content}</div></div>
  ${copy}</section>`;
}

// Плагин Figma не принимает файл тяжелее пятидесяти мегабайт, а ужимать
// скриншоты нельзя — качество падает. Значит режем сам файл: слайды
// раскладываются по нескольким HTML, каждый со своей оболочкой.
// Нумерация слайдов при этом сквозная — она проставлена заранее.
const FIGMA_LIMIT  = 50 * 1024 * 1024;   // потолок плагина
const FIGMA_TARGET = 45 * 1024 * 1024;   // целимся ниже, чтобы был запас

function figmaSplit(slideHtml, shell){
  // Считаем по длине строки: скриншоты внутри — base64, то есть чистый
  // ASCII, где символ равен байту. Кириллица в тексте занижает оценку,
  // но её доля меньше процента, а запас до потолка в пять мегабайт.
  const sizes = slideHtml.map(h=>h.length);
  const shellSize = shell('').length;
  const total = shellSize + sizes.reduce((a,b)=>a+b, 0);

  const pack = (list, from) => ({
    html:   shell(list.join('\n')),
    from,
    to:     from + list.length - 1,
    slides: list.length,
    bytes:  shellSize + list.reduce((a,h)=>a + h.length, 0)
  });

  if(total <= FIGMA_LIMIT) return [pack(slideHtml, 1)];

  // Делим не «пока влезает», а на равные куски — иначе последняя часть
  // выходит огрызком в пару слайдов
  const n = Math.ceil(total / FIGMA_TARGET);
  const target = total / n;

  const parts = [];
  let cur = [], curBytes = shellSize, from = 1;
  slideHtml.forEach((h, i)=>{
    if(cur.length && curBytes + sizes[i] > target && parts.length < n - 1){
      parts.push(pack(cur, from));
      from += cur.length;
      cur = []; curBytes = shellSize;
    }
    cur.push(h); curBytes += sizes[i];
  });
  if(cur.length) parts.push(pack(cur, from));
  return parts;
}

// Слайд содержания. Собираем по заголовкам разделов: берём первый слайд
// каждого раздела и его номер. Номера уже с учётом того, что лекция
// начинается с третьей страницы.
function figmaToc(slides, firstContentPage){
  const items = [];
  let prev = null;
  slides.forEach((sl, i)=>{
    const h = (sl.heading || '').trim();
    if(!h || h === prev) return;
    prev = h;
    items.push({text: h, page: i + firstContentPage});
  });

  const head = `<div class="sl-head">`+
    `<span class="hd-l"><span class="hd-num">2</span><i>|</i>Содержание</span>`+
    `<span class="hd-r">SmartComp <span class="hd-tel">*3196</span></span></div>`;

  // Больше десяти пунктов в одну колонку не влезает
  const cols = items.length > 10 ? ' toc-2col' : '';
  const list = items.map(it=>
    `<div class="toc-item"><span class="toc-t">${fgEsc(it.text)}</span>`+
    `<span class="toc-n">${it.page}</span></div>`
  ).join('');

  return `<section class="slide slide-toc">${BG_IMG}${head}
  <div class="sl-body"><div class="toc-wrap${cols}">${list}</div></div>
  <div class="sl-copy">Инструкция является интеллектуальной собственностью компании SmartComp и защищена авторским правом. Копирование или распространение материала третьим лицам карается законом Израиля.</div>
</section>`;
}

function buildFigmaHtml(title, raw){
  const blocks = figmaTokenize(raw);
  const slides = figmaGroup(blocks);
  const subtitle = extractSubtitle(raw);

  const course = (document.getElementById('courseInput').value || '').trim();
  const lecRaw = _lecNum;
  // Номер на титуле в две цифры — «02», а не «2»
  const lecNum = lecRaw ? String(lecRaw).padStart(2, '0') : '';

  // Страница 1 — титул, страница 2 — содержание, лекция идёт с третьей
  const FIRST_CONTENT_PAGE = 3;

  const cover = `<section class="slide slide-cover">${BG_IMG}
  ${lecNum ? `<div class="cv-num">${fgEsc(lecNum)}</div>` : ''}
  ${course ? `<div class="cv-badge">${fgEsc(course)}</div>` : ''}
  <div class="cv-title">${fgEsc(title)}</div>
  ${subtitle?`<p class="cv-sub">${fgEsc(subtitle)}</p>`:''}
  <div class="cv-logo">SmartComp <span class="hd-tel">*3196</span></div>
</section>`;

  const toc  = figmaToc(slides, FIRST_CONTENT_PAGE);
  const body = slides.map((s,i)=>figmaSlide(s, i + FIRST_CONTENT_PAGE, title));

  // Оболочка одна и та же для любой части: шрифты, стили, обёртка
  const shell = inner => `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${fgEsc(title)} — SmartComp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Days+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
